<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>AI Tool</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 30px;
    }
    textarea {
      width: 100%;
      height: 120px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      background: white;
      padding: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h2>AI Generator</h2>

<textarea id="prompt" placeholder="Entrez votre texte ici..."></textarea>
<br>
<button onclick="send()">Generate</button>

<div id="result"></div>

<script>
async function send() {
  const prompt = document.getElementById("prompt").value;
  document.getElementById("result").innerText = "Processing...";

  const res = await fetch(
    "https://dawn-cherry-24d2.revolka5.workers.dev",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: prompt })
    }
  );

  const data = await res.json();
  document.getElementById("result").innerText =
    data.output || "No response";
}
</script>

</body>
</html>
