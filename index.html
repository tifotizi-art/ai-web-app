<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>AI Web App</title>
</head>
<body>

<h2>Mon application IA</h2>

<textarea id="text" rows="6" cols="50" placeholder="Écris ici..."></textarea>
<br><br>
<button onclick="send()">Envoyer</button>

<pre id="out"></pre>

<script>
async function send() {
  const res = await fetch("https://dawn-cherry-24d2.revolka5.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ input: text.value })
  });

  out.textContent = await res.text();
}
</script>

</body>
</html>
